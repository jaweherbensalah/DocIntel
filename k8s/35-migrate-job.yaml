# Runs the schema migration once, before the new pods roll out. Deploy order is
# enforced by the pipeline:
#   kubectl apply -f k8s/
#   kubectl -n docintel wait --for=condition=complete job/docintel-migrate
# Safe to run ahead of the rollout because the migrations are expand-only.
apiVersion: batch/v1
kind: Job
metadata:
  name: docintel-migrate
  namespace: docintel
  labels:
    app.kubernetes.io/part-of: docintel
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: docintel
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo "waiting for postgres"; sleep 2; done
      containers:
        - name: migrate
          image: docintel:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: docintel-config
            - secretRef:
                name: docintel-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: tmp
          emptyDir: {}
