apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: docintel
  labels:
    app.kubernetes.io/part-of: docintel
    app.kubernetes.io/component: database
spec:
  selector:
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
# StatefulSet rather than Deployment: the database needs stable identity and a
# volume that survives rescheduling.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: docintel
  labels:
    app.kubernetes.io/part-of: docintel
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: docintel
        app.kubernetes.io/component: database
    spec:
      securityContext:
        # The official postgres image runs as uid 999; make the mounted volume
        # group-writable by it.
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: docintel-secret
          env:
            # Keep PGDATA in a subdirectory: the volume root can contain
            # lost+found, which Postgres refuses to initialise over.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "docintel"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "docintel"]
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
