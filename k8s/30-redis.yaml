apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: docintel
  labels:
    app.kubernetes.io/part-of: docintel
    app.kubernetes.io/component: broker
spec:
  selector:
    app.kubernetes.io/component: broker
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: docintel
  labels:
    app.kubernetes.io/part-of: docintel
    app.kubernetes.io/component: broker
spec:
  replicas: 1
  # Only one Redis may hold the queue at a time; replace the pod rather than
  # briefly running two.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: broker
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: docintel
        app.kubernetes.io/component: broker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Redis snapshots to /data; without a writable mount, BGSAVE fails.
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: data
          emptyDir: {}
