# Celery worker: same image, different command. Takes no inbound traffic, so it
# has no Service — only a metrics port for Prometheus to scrape.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docintel-worker
  namespace: docintel
  labels:
    app.kubernetes.io/part-of: docintel
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: docintel
        app.kubernetes.io/component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      # Celery is configured with task_acks_late, so a job interrupted by a
      # restart is redelivered. The grace period lets the current task finish
      # first, so in practice a rolling deploy doesn't replay work.
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do echo "waiting for postgres"; sleep 2; done
              until nc -z redis 6379; do echo "waiting for redis"; sleep 2; done
      containers:
        - name: worker
          image: docintel:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - app.celery_app
            - worker
            - --loglevel=info
            - --concurrency=2
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: docintel-config
            - secretRef:
                name: docintel-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            # A worker with a wedged event loop still has a live process, so
            # probe it the way Celery itself does.
            exec:
              command:
                - sh
                - -c
                - celery -A app.celery_app inspect ping -d celery@$(hostname) | grep -q pong
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "150m"
              memory: "192Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
      volumes:
        - name: tmp
          emptyDir: {}
