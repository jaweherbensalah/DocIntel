apiVersion: v1
kind: Service
metadata:
  name: docintel-api
  namespace: docintel
  labels:
    app.kubernetes.io/part-of: docintel
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docintel-api
  namespace: docintel
  labels:
    app.kubernetes.io/part-of: docintel
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: docintel
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        # The app opens a DB connection on startup; wait for the datastores so
        # the first pods don't crash-loop while Postgres is still initialising.
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do echo "waiting for postgres"; sleep 2; done
              until nc -z redis 6379; do echo "waiting for redis"; sleep 2; done
      containers:
        - name: api
          image: docintel:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: docintel-config
            - secretRef:
                name: docintel-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            # Covers slow first boot (table creation) so livenessProbe doesn't
            # restart the pod before it has finished starting.
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          volumeMounts:
            # Root filesystem is read-only, so give the app writable scratch
            # for the debug copies of uploads and anything under /tmp.
            - name: uploads
              mountPath: /app/uploads
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: uploads
          emptyDir: {}
        - name: tmp
          emptyDir: {}
