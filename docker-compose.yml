services:
  # Owns the schema; runs once and exits.
  migrate:
    build: .
    command: sh -c "alembic upgrade head && python -m app.admin seed"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://docintel:docintel@db:5432/docintel
      API_KEY: ${API_KEY:-dev-local-key-change-me}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://docintel:docintel@db:5432/docintel
      REDIS_URL: redis://redis:6379/0
      API_KEY: ${API_KEY:-dev-local-key-change-me}
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    ports:
      - "9100:9100"  # Prometheus metrics for the worker
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://docintel:docintel@db:5432/docintel
      REDIS_URL: redis://redis:6379/0
      API_KEY: ${API_KEY:-dev-local-key-change-me}
      # Aggregate metrics across the worker's prefork child processes.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
      WORKER_METRICS_PORT: 9100
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: docintel
      POSTGRES_PASSWORD: docintel
      POSTGRES_DB: docintel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docintel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
