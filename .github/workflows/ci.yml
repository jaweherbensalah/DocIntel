name: CI

# CI pipeline:
#   1. test         — run the unit/integration suite on every push and PR.
#   2. build-smoke  — build the image and prove the whole stack boots and
#                     serves a real request via docker compose.
#   3. publish      — push the image to GHCR, but only on main / version tags.
#
# Vulnerability scanning and provenance are covered by Ticket 18.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # The suite runs fully offline (SQLite + Celery eager + fake LLM).
        env:
          API_KEY: ci-test-key
        run: python -m pytest -q

  build-smoke:
    name: Build image + compose smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t docintel:ci .

      - name: Bring up the stack
        env:
          API_KEY: ci-smoke-key
        run: docker compose up -d --build

      - name: Wait for the API to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fs localhost:8000/health; then echo "healthy"; exit 0; fi
            sleep 2
          done
          echo "API did not become healthy" >&2
          docker compose logs
          exit 1

      - name: Smoke test — extract round trip
        env:
          API_KEY: ci-smoke-key
        run: |
          set -euo pipefail
          id=$(curl -fs -X POST localhost:8000/extract \
                 -H "x-api-key: $API_KEY" \
                 -F "file=@fixtures/cv_jane_doe.txt" | python -c "import sys,json;print(json.load(sys.stdin)['id'])")
          echo "job id: $id"
          for i in $(seq 1 30); do
            status=$(curl -fs localhost:8000/results/$id -H "x-api-key: $API_KEY" \
                       | python -c "import sys,json;print(json.load(sys.stdin)['status'])")
            echo "status: $status"
            if [ "$status" = "done" ]; then exit 0; fi
            if [ "$status" = "failed" ]; then echo "extraction failed" >&2; exit 1; fi
            sleep 2
          done
          echo "extraction did not complete" >&2
          docker compose logs worker
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v

  scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t docintel:scan .

      - name: Scan dependencies and OS packages
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: docintel:scan
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif

      - name: Fail on fixable high or critical findings
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: docintel:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: [test, build-smoke, scan]
    # Only publish from the main branch or a version tag, never from PRs.
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write  # keyless signing: GitHub mints the OIDC token
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Records how the image was built, in the image itself.
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image
        # Keyless: the signature is bound to this workflow's identity and
        # logged in Rekor, so there is no private key for us to leak.
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attach SBOM as a signed attestation
        run: |
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json \
            ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}

      - name: Record the digest in the job summary
        run: |
          echo "Published \`ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
